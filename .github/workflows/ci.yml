name: Offline checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: Python 3.12 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.23"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install project Python
        run: uv python install
      - name: Install the locked development environment
        run: uv sync --locked --group dev
      - name: Lint
        run: uv run --locked --offline --group dev ruff check .
      - name: Check formatting
        run: uv run --locked --offline --group dev ruff format --check .
      - name: Check types
        run: uv run --locked --offline --group dev mypy src
      - name: Run offline tests
        run: uv run --locked --offline --group dev pytest -q
      - name: Validate scaffold declarations
        run: uv run --locked --offline orchestrator pipeline check --level scaffold
      - name: Inspect the planned stages
        run: uv run --locked --offline orchestrator pipeline plan