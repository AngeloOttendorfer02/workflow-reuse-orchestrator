[project]
name = "workflow-reuse-orchestrator"
version = "0.1.0"
description = "Task-adaptive document reasoning through workflow reuse"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1,<0.29",
    "pydantic>=2.13.5,<3",
    "pyyaml>=6.0.3,<7",
]

[project.scripts]
orchestrator = "workflow_reuse_orchestrator.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1,<3",
    "pytest>=9.1.1,<10",
    "ruff>=0.16.6,<0.17",
    "types-pyyaml>=6.0.12.20260815",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*.ipynb" = ["E402", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "live: explicit opt-in tests that may contact an external model runtime",
]